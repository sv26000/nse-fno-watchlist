name: Update watchlist

on:
  # Run manually from the Actions tab.
  workflow_dispatch:
  # Weekday refresh at 12:30 UTC (~18:00 IST), after market close.
  schedule:
    - cron: "30 12 * * 1-5"

# Allow the job to push commits back to the repository.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch live data and regenerate watchlist
        run: |
          python extract_symbols.py \
            --require-live \
            --save-json \
            --output watchlist.txt
          echo "Generated $(wc -l < watchlist.txt) symbols."

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.json watchlist.txt)" ]; then
            git add data.json watchlist.txt
            git commit -m "chore: auto-update watchlist ($(date -u +%Y-%m-%d))"
            git push
            echo "Committed updated watchlist."
          else
            echo "No changes to commit."
          fi
